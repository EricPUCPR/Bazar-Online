<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Autenticação</title>
        <link rel="stylesheet" href="css/style.css">

        <style>
            body {
                margin: 0;
                font-family: Arial;
                background-color: #7fa6d6;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
            }

            header {
                position: absolute;
                top: 20px;
            }

            nav {
                display: flex;
                gap: 10px;
            }

            .botao a {
                background-color: white;
                padding: 8px 12px;
                border-radius: 5px;
                text-decoration: none;
                color: black;
                font-weight: bold;
            }

            .form {
                background-color: #0d6efd;
                padding: 40px;
                border-radius: 10px;
                width: 320px;
                text-align: center;
            }

            h2 {
            color: white;
            }

            label {
                display: block;
                text-align: left;
                color: white;
                margin-top: 10px;
            }

            input {
                width: 100%;
                padding: 10px;
                margin: 5px 0;
                border: none;
                border-radius: 5px;
            }

            #botao {
                width: 150px;
                padding: 10px;
                margin: 15px auto 0 auto;
                display: block;
                background-color: white;
                border: none;
                border-radius: 5px;
                font-weight: bold;
                cursor: pointer;
            }

            #feedback {
                display: block;
                margin-top: 10px;
                font-size: 14px;
            }

            footer {
                position: absolute;
                bottom: 10px;
                text-align: center;
                color: white;
                font-size: 12px;
            }
        </style>
    </head>
    <body>
        <main>
            <section class="form"> 
                
                <form id="autentica">
                    <h2>Login</h2>
                    <label for="email">Email: </label>
                    <input type="email" name="email" id="email" >
                    <label for="senha">Senha: </label>
                    <input type="password" name="senha" id="senha">
                    
                    <span id="feedback"></span>

                    <button type="submit" id="botao">Acessar</button>
                    
                </form>

                <a href="CadastroUsuarios.php">Crie sua conta</a>
            
            </section>
        </main>

        <script>
            const feedback = document.getElementById("feedback");
            const email = document.getElementById("email");
            const senha = document.getElementById("senha");
            const botao = document.getElementById("botao");
            
            document.addEventListener( 'input', () => {
                const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const regexSenha = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#]).{8,}$/;

                const emailOK = regexEmail.test(email.value);
                const senhaForte = regexSenha.test(senha.value);

                if (!emailOK) {
                    botao.style.display = "none";
                    feedback.textContent = "padrão de email invalido!";
                    feedback.style.color =  "red";
                } else {
                    if(senhaForte){
                        botao.style.display = "block";
                        feedback.style.display = "none";
                    } else {
                        botao.style.display = "block";
                        feedback.style.display = "none";
                        feedback.textContent = "usuario ou senha incorretos";
                    }
                    
                }
            })
            document.getElementById("autentica").addEventListener("submit", function(e){
                e.preventDefault();

                const feedback = document.getElementById("feedback");
                const formData = new FormData(this);
                fetch("../php/autentica.php",{
                    body: formData
                }).then(response => response.json())
                .then(data =>{
                    feedback.textContent = data.mensage;
                    feedback.style.color = data.success ? "green" : "red"; 
                
                    if (data.success) {
                        setTimeout(() => {
                            window.location.href = "../index.html";
                        }, 2000);
                    }
                })
                .catch(error => {
                    console.error('Erro:', error);
                    feedback.textContent = "Erro interno no servidor.";
                });
            })
        </script>

    </body>
</html>
