<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

body {
    background: #e6e6e6;
}

.header {
    height: 60px;
    background: #1f6f9f;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 0 20px;
    gap: 10px;
}

.header a {
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: bold;
}

.login {
    background: #ffffff;
    color: #1f6f9f;
}

.cadastro {
    background: #0d4f73;
    color: white;
}

.main {
    display: flex;
    justify-content: center;
    align-items: center;
    height: calc(100vh - 60px);
    background: #b7c7d9;
}

.box {
    width: 320px;
    background: white;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.box h2 {
    margin-bottom: 15px;
    color: #1f6f9f;
}

.box label {
    display: block;
    text-align: left;
    margin-top: 10px;
    font-weight: bold;
    color: #333;
}

.box input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: none;
    background: #eef2f6;
}

#botao {
    width: 100%;
    margin-top: 15px;
    padding: 10px;
    background: #1f6f9f;
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

#botao:hover {
    background: #0d4f73;
}

#feedback {
    display: block;
    margin-top: 10px;
    font-size: 14px;
}

.link {
    margin-top: 15px;
    display: block;
    text-decoration: none;
    color: #1f6f9f;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="header">
    <a href="index.html" class="login">Voltar</a>
    <a href="CadastroUsuarios.php" class="cadastro">Cadastrar</a>
</div>

<div class="main">
    <div class="box">
        <form id="autentica">
            <h2>Login</h2>

            <label for="email">Email</label>
            <input type="email" id="email">

            <label for="senha">Senha</label>
            <input type="password" id="senha">

            <span id="feedback"></span>

            <button type="submit" id="botao">Acessar</button>
        </form>

        <a href="CadastroUsuarios.php" class="link">Criar conta</a>
    </div>
</div>

<script>
const feedback = document.getElementById("feedback");
const email = document.getElementById("email");
const senha = document.getElementById("senha");
const botao = document.getElementById("botao");

document.addEventListener('input', () => {
    const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const regexSenha = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#]).{8,}$/;

    const emailOK = regexEmail.test(email.value);
    const senhaForte = regexSenha.test(senha.value);

    if (!emailOK) {
        botao.style.display = "none";
        feedback.textContent = "Email inválido!";
        feedback.style.color = "red";
    } else {
        botao.style.display = "block";

        if (!senhaForte) {
            feedback.textContent = "Senha fraca!";
            feedback.style.color = "orange";
        } else {
            feedback.textContent = "";
        }
    }
});

document.getElementById("autentica").addEventListener("submit", function(e){
    e.preventDefault();

    const formData = new FormData(this);

    fetch("../php/autentica.php", {
        method: "POST",
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        feedback.textContent = data.mensage;
        feedback.style.color = data.success ? "green" : "red";

        if (data.success) {
            setTimeout(() => {
                window.location.href = "../index.html";
            }, 2000);
        }
    })
    .catch(error => {
        console.error('Erro:', error);
        feedback.textContent = "Erro interno no servidor.";
        feedback.style.color = "red";
    });
});
</script>

</body>
</html>
