<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Inicio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

body {
    background: #e6e6e6;
}

.header {
    height: 60px;
    background: #1f6f9f;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 0 20px;
    gap: 10px;
}

.header a {
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: bold;
}

.login {
    background: #ffffff;
    color: #1f6f9f;
}

.cadastro {
    background: #0d4f73;
    color: white;
}

.cart-btn {
    background: #ffffff;
    color: #1f6f9f;
}

.main {
    display: flex;
    height: calc(100vh - 60px);
}

.sidebar {
    width: 80px;
    background: #1f6f9f;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 20px;
    font-size: 24px;
    color: white;
}

.content {
    flex: 1;
    padding: 30px;
    background: #b7c7d9;
}

.topbar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 25px;
}

.filters {
    display: flex;
    gap: 10px;
}

select, input {
    padding: 8px;
    border-radius: 6px;
    border: none;
    background: #eef2f6;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.item {
    height: 100px;
    background: #f5f7fa;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
}

.item:hover {
    background: #e3ebf3;
    transform: scale(1.03);
}

.cart {
    position: fixed;
    right: -320px;
    top: 60px;
    width: 320px;
    height: calc(100% - 60px);
    background: #ffffff;
    box-shadow: -3px 0 15px rgba(0,0,0,0.2);
    transition: 0.3s;
    padding: 15px;
    overflow-y: auto;
}

.cart.active {
    right: 0;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.total {
    margin-top: 20px;
    font-weight: bold;
}

.screen {
    display: none;
    position: fixed;
    top: 60px;
    left: 80px;
    right: 0;
    bottom: 0;
    background: #b7c7d9;
    padding: 40px;
}

.screen.active {
    display: block;
}

.box {
    width: 300px;
    margin: 100px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

.box input {
    width: 100%;
    margin-bottom: 10px;
}

.user-icon {
    background: #e6e6e6;
    color: #1f6f9f;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    text-decoration: none;
    margin-bottom: 10px;
    transition: 0.3s;
}

.user-icon:hover {
    background: #d5d5d5;
    transform: scale(1.1);
}

</style>
</head>

<body>

<div class="header">
    <a href="#" class="cart-btn" onclick="toggleCart()">Carrinho (<span id="count">0</span>)</a>
    <a href="Login.html" class="login">Login</a>
    <a href="CadastroUsuarios.php" class="cadastro">Cadastrar</a>
</div>

<div class="main">

    <div class="sidebar">
        <a href="PaginaUsuario.php" class="user-icon">👤</a>
    </div>

    <div class="content">

        <div class="topbar">
            <div class="filters">
                <select>
                    <option>Tamanho</option>
                    <option>P</option>
                    <option>M</option>
                    <option>G</option>
                </select>

                <select>
                    <option>Peça</option>
                    <option>Camiseta</option>
                    <option>Calça</option>
                    <option>Jaqueta</option>
                </select>

                <select>
                    <option>Sexo</option>
                    <option>Masculino</option>
                    <option>Feminino</option>
                </select>
            </div>

            <input type="text" placeholder="Buscar...">
        </div>

        <div class="grid">
            <div class="item" onclick="addItem('Camiseta', 0)">Camiseta</div>
            <div class="item" onclick="addItem('Calça', 0)">Calça</div>
            <div class="item" onclick="addItem('Jaqueta', 0)">Jaqueta</div>
            <div class="item" onclick="addItem('Blusa', 0)">Blusa</div>

            <div class="item" onclick="addItem('Short', 0)">Short</div>
            <div class="item" onclick="addItem('Vestido', 0)">Vestido</div>
            <div class="item" onclick="addItem('Casaco', 0)">Casaco</div>
            <div class="item" onclick="addItem('Regata', 0)">Regata</div>
        </div>

    </div>

</div>

<div class="cart" id="cart">
    <h3>Carrinho</h3>
    <div id="cartItems"></div>
    <div class="total">Total: R$ <span id="total">0</span></div>
</div>

<div class="screen" id="login">
    <div class="box">
        <h3>Login</h3>
        <input type="text" placeholder="Usuário">
        <input type="password" placeholder="Senha">
        <button onclick="hideScreens()">Entrar</button>
    </div>
</div>

<div class="screen" id="cadastro">
    <div class="box">
        <h3>Cadastro</h3>
        <input type="text" placeholder="Usuário">
        <input type="password" placeholder="Senha">
        <button onclick="hideScreens()">Cadastrar</button>
    </div>
</div>

<script>
let cart = [];

function toggleCart() {
    document.getElementById("cart").classList.toggle("active");
}

function addItem(name, price) {
    cart.push({name, price});
    renderCart();
}

function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
}

function renderCart() {
    let html = "";
    let total = 0;

    cart.forEach((item, i) => {
        total += item.price;
        html += `
            <div class="cart-item">
                ${item.name} - R$${item.price}
                <button onclick="removeItem(${i})">X</button>
            </div>
        `;
    });

    document.getElementById("cartItems").innerHTML = html;
    document.getElementById("total").innerText = total;
    document.getElementById("count").innerText = cart.length;
}

function showScreen(screen) {
    document.getElementById(screen).classList.add("active");
}

function hideScreens() {
    document.getElementById("login").classList.remove("active");
    document.getElementById("cadastro").classList.remove("active");
}
</script>

</body>
</html>
