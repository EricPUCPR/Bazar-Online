<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazar Online - Publicar Roupa</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/app.css">
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
        }
    </style>
</head>

<body class="auth-page">

<div class="app-header">
    <a href="../index.html" class="header-link btn-light">Voltar</a>
</div>

<div class="page-main">
    <div class="box">
        <h2>Publicar Roupa</h2>
        <p id="feedback"></p>

        <form id="cadastra" enctype="multipart/form-data">
            <label>Título da doação</label>
            <input type="text" name="titulo" maxlength="120" placeholder="Ex: Blusa de frio infantil" required>

            <label>Tipo da roupa</label>
            <input type="text" name="tipo" placeholder="Ex: Camiseta, Calça, Jaqueta" required>

            <label>Tamanho</label>
            <select name="tamanho" required>
                <option value="">Selecione</option>
                <option value="PP">PP</option>
                <option value="P">P</option>
                <option value="M">M</option>
                <option value="G">G</option>
                <option value="GG">GG</option>
                <option value="XG">XG</option>
            </select>

            <label>Sexo</label>
            <select name="sexo" required>
                <option value="Masculino">Masculino</option>
                <option value="Feminino">Feminino</option>
                <option value="Unissex" selected>Unissex</option>
            </select>

            <label>Estado</label>
            <select name="estado" required>
                <option value="Novo">Novo</option>
                <option value="Semi-Novo" selected>Semi-Novo</option>
                <option value="Usado">Usado</option>
            </select>

            <label>Local da doação</label>
            <input type="text" name="local_doacao" placeholder="Ex: Centro, São Paulo" required>

            <label>Foto da peça</label>
            <input type="file" name="foto" accept="image/jpeg,image/png,image/webp" required>

            <button type="submit" class="btn-block" style="margin-top: 15px;">Cadastrar Roupa</button>
        </form>
    </div>
</div>

<script type="module">
    import { api, auth } from '../assets/js/api.js';

    // Redireciona se não estiver logado
    if (!auth.estaLogado()) {
        window.location.href = "login.html";
    }

    const form = document.getElementById("cadastra");
    const feedback = document.getElementById("feedback");

    function setFeedback(message, status = "muted") {
        feedback.className = `feedback feedback-${status}`;
        feedback.textContent = message;
    }

    form.addEventListener("submit", async function (e) {
        e.preventDefault();

        if (!this.checkValidity()) {
            this.classList.add("was-validated");
            return;
        }
        this.classList.add("was-validated");

        setFeedback("Publicando anúncio...", "muted");

        try {
            const formData = new FormData(this);
            const response = await api.cadastrarRoupa(formData);

            if (response.success) {
                setFeedback(response.mensagem || "Roupa cadastrada com sucesso!", "success");
                setTimeout(() => {
                    window.location.href = "../index.html";
                }, 1000);
            } else {
                setFeedback(response.mensagem || "Erro ao publicar roupa.", "error");
            }
        } catch (error) {
            console.error(error);
            setFeedback("Erro interno ao conectar com o servidor.", "error");
        }
    });
</script>

</body>
</html>
