<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Inicio</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>

<body class="store-page">

<div class="app-header">
    <span id="saudacaoUsuario" class="saudacao"></span>
    <a href="#" class="header-link btn-light" onclick="toggleCart()">Minha lista (<span id="count">0</span>)</a>
    <a href="Login.html" id="loginLink" class="header-link btn-light">Login</a>
    <a href="CadastroUsuarios.php" id="cadastroLink" class="header-link btn-primary">Cadastrar</a>
    <a href="logout.php" id="logoutLink" class="header-link btn-light logout-icon" title="Sair" aria-label="Sair" hidden onclick="return confirm('Tem certeza que deseja sair?')">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <path d="M16 17l5-5-5-5"></path>
            <path d="M21 12H9"></path>
        </svg>
    </a>
</div>

<div class="app-main">

    <div class="sidebar">
        <a href="CadastroRoupas.php" class="user-icon">👕</a>
        <a href="PaginaUsuario.php" class="user-icon">👤</a>
        <a href="admin_logs.php" class="user-icon admin-only" title="Logs" aria-label="Logs" hidden>📋</a>
        <a href="admin_usuarios.php" class="user-icon admin-only" title="Gerenciar usuários" aria-label="Gerenciar usuários" hidden>👥</a>
    </div>

    <div class="content">

        <div class="topbar">
            <div class="filters">
                <select id="filtroTamanho">
                    <option value="">Tamanho</option>
                    <option value="PP">PP</option>
                    <option value="P">P</option>
                    <option value="M">M</option>
                    <option value="G">G</option>
                    <option value="GG">GG</option>
                    <option value="XG">XG</option>
                </select>

                <select id="filtroPeca">
                    <option value="">Peça</option>
                    <option value="Camiseta">Camiseta</option>
                    <option value="Calça">Calça</option>
                    <option value="Jaqueta">Jaqueta</option>
                    <option value="Blusa">Blusa</option>
                </select>

                <select id="filtroSexo">
                    <option value="">Sexo</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Unissex">Unissex</option>
                </select>
            </div>

            <input type="text" id="buscaText" placeholder="Buscar...">
        </div>

        <div class="grid" id="roupasGrid">
            <p class="empty-state">Carregando roupas...</p>
        </div>

    </div>
</div>

<div class="cart" id="cart">
    <h3>Minha lista</h3>
    <div id="cartItems"></div>
    <button type="button" id="finalizarBtn" class="btn-block" onclick="irParaFinalizacao()" disabled>Finalizar doação</button>
</div>

<script>
let cart = [];
let roupas = [];
let usuarioLogado = false;
let adminLogado = false;
const saudacaoUsuario = document.getElementById("saudacaoUsuario");
const linksAdmin = document.querySelectorAll(".admin-only");
const roupasGrid = document.getElementById("roupasGrid");
const loginLink = document.getElementById("loginLink");
const cadastroLink = document.getElementById("cadastroLink");
const logoutLink = document.getElementById("logoutLink");
const finalizarBtn = document.getElementById("finalizarBtn");

function atualizarLinksAdmin(adminLogado) {
    linksAdmin.forEach((link) => {
        link.hidden = !adminLogado;
    });
}

function atualizarHeader(logado, admin, nome) {
    usuarioLogado = logado;
    adminLogado = admin;
    loginLink.hidden = logado;
    cadastroLink.hidden = logado;
    logoutLink.hidden = !logado;

    if (logado && nome) {
        saudacaoUsuario.textContent = admin ? `Olá admin, ${nome}` : `Olá, ${nome}`;
        saudacaoUsuario.classList.add("is-visible");
    } else {
        saudacaoUsuario.textContent = "";
        saudacaoUsuario.classList.remove("is-visible");
    }

    atualizarLinksAdmin(admin);
}

async function carregarUsuarioLogado() {
    try {
        const resposta = await fetch("session_usuario.php", {
            method: "GET",
            credentials: "same-origin"
        });

        const dados = await resposta.json();

        if (dados.logado && dados.nome) {
            atualizarHeader(true, Boolean(dados.admin), dados.nome);
        } else {
            atualizarHeader(false, false, "");
        }
    } catch (erro) {
        console.error("Não foi possível carregar a sessão:", erro);
        atualizarHeader(false, false, "");
    }
}

function toggleCart() {
    document.getElementById("cart").classList.toggle("active");
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function addItem(id) {
    const roupa = roupas.find((item) => Number(item.id) === Number(id));
    if (!roupa || Number(roupa.pausado) === 1) return;

    if (cart.some((item) => Number(item.id) === Number(id))) {
        return;
    }

    cart.push(roupa);
    renderCart();
    atualizarBotoesCarrinho();
}

function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
    atualizarBotoesCarrinho();
}

function renderCart() {
    let html = "";

    cart.forEach((item, i) => {
        html += `
            <div class="cart-item">
                <span>${escapeHtml(item.titulo || item.tipo)} - ${escapeHtml(item.local_doacao || "Local não informado")}</span>
                <button onclick="removeItem(${i})">X</button>
            </div>
        `;
    });

    if (cart.length === 0) {
        html = `<p class="empty-state">Nenhuma roupa selecionada.</p>`;
    }

    document.getElementById("cartItems").innerHTML = html;
    document.getElementById("count").innerText = cart.length;
    finalizarBtn.disabled = cart.length === 0;
}

const filtroTamanho = document.getElementById("filtroTamanho");
const filtroPeca = document.getElementById("filtroPeca");
const filtroSexo = document.getElementById("filtroSexo");
const buscaText = document.getElementById("buscaText");

function renderizarRoupas(lista) {
    if (lista.length === 0) {
        roupasGrid.innerHTML = `<p class="empty-state">Nenhuma roupa cadastrada ainda.</p>`;
        return;
    }

    roupasGrid.innerHTML = lista.map((roupa) => {
        const pausado = Number(roupa.pausado) === 1;
        const noCarrinho = cart.some((item) => Number(item.id) === Number(roupa.id));

        return `
        <div class="item" data-id="${Number(roupa.id)}" data-tamanho="${escapeHtml(roupa.tamanho || "")}" data-tipo="${escapeHtml(roupa.tipo || "")}" data-sexo="${escapeHtml(roupa.sexo || "")}" data-local="${escapeHtml(roupa.local_doacao || "")}" data-busca="${escapeHtml(`${roupa.titulo || ""} ${roupa.tipo || ""} ${roupa.tamanho || ""} ${roupa.sexo || ""} ${roupa.estado || ""} ${roupa.local_doacao || ""}`)}">
            <div class="img-box">
                ${roupa.foto_path ? `<img src="${escapeHtml(roupa.foto_path)}" alt="${escapeHtml(roupa.titulo || roupa.tipo)}" class="item-photo">` : "Sem foto"}
                ${pausado ? `<span class="paused-badge">Anúncio pausado</span>` : ""}
            </div>
            <div class="item-info">
                <div class="item-info-row">
                    <div class="item-details">
                        <strong>${escapeHtml(roupa.titulo || roupa.tipo)}</strong>
                        <small>${escapeHtml(roupa.tipo || "-")}</small>
                        <small>Tam ${escapeHtml(roupa.tamanho || "-")} • ${escapeHtml(roupa.sexo || "-")} • ${escapeHtml(roupa.estado || "-")}</small>
                        <small class="item-location">Local: ${escapeHtml(roupa.local_doacao || "Não informado")}</small>
                    </div>
                    <button type="button" class="cart-add-btn" onclick="addItem(${Number(roupa.id)})" ${pausado || noCarrinho ? "disabled" : ""} title="Adicionar à lista" aria-label="Adicionar à lista">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L23 6H6"></path>
                        </svg>
                    </button>
                </div>
                ${adminLogado ? `
                    <div class="admin-item-actions">
                        <button type="button" class="btn-danger btn-small" onclick="excluirAnuncio(${Number(roupa.id)})">Excluir</button>
                    </div>
                ` : ""}
                </div>
            </div>
        </div>
        `;
    }).join("");

    atualizarBotoesCarrinho();
}

async function carregarRoupas() {
    try {
        const resposta = await fetch("listar_roupas.php", {
            method: "GET",
            credentials: "same-origin"
        });

        const dados = await resposta.json();
        roupas = dados.success ? dados.roupas : [];
        renderizarRoupas(roupas);
        aplicarFiltros();
    } catch (erro) {
        console.error("Não foi possível carregar as roupas:", erro);
        roupasGrid.innerHTML = `<p class="empty-state">Não foi possível carregar as roupas.</p>`;
    }
}

function aplicarFiltros() {
    const items = document.querySelectorAll("#roupasGrid .item");
    const valTamanho = filtroTamanho.value.toLowerCase();
    const valPeca = filtroPeca.value.toLowerCase();
    const valSexo = filtroSexo.value.toLowerCase();
    const valBusca = buscaText.value.toLowerCase();

    items.forEach(item => {
        const tamanho = item.dataset.tamanho.toLowerCase();
        const tipo = item.dataset.tipo.toLowerCase();
        const sexo = item.dataset.sexo.toLowerCase();
        const busca = item.dataset.busca.toLowerCase();
        let exibir = true;

        if (valTamanho !== "" && tamanho !== valTamanho) {
            exibir = false;
        }
        
        if (valPeca !== "" && tipo !== valPeca) {
            exibir = false;
        }

        if (valSexo !== "" && sexo !== valSexo) {
            exibir = false;
        }

        if (valBusca !== "" && !busca.includes(valBusca)) {
            exibir = false;
        }

        item.style.display = exibir ? "" : "none";
    });
}

filtroTamanho.addEventListener("change", aplicarFiltros);
filtroPeca.addEventListener("change", aplicarFiltros);
filtroSexo.addEventListener("change", aplicarFiltros);
buscaText.addEventListener("input", aplicarFiltros);
carregarUsuarioLogado().then(carregarRoupas);

function atualizarBotoesCarrinho() {
    document.querySelectorAll(".cart-add-btn").forEach((button) => {
        const card = button.closest(".item");
        if (!card) return;
        const id = Number(card.dataset.id);
        const roupa = roupas.find((item) => Number(item.id) === id);
        const pausado = roupa && Number(roupa.pausado) === 1;
        const noCarrinho = cart.some((item) => Number(item.id) === id);
        button.disabled = pausado || noCarrinho;
    });
}

async function excluirAnuncio(id) {
    if (!adminLogado || !confirm("Excluir este anúncio?")) {
        return;
    }

    const formData = new FormData();
    formData.append("id", id);

    try {
        const resposta = await fetch("excluir_roupa.php", {
            method: "POST",
            body: formData,
            credentials: "same-origin"
        });
        const dados = await resposta.json();

        if (!dados.success) {
            alert(dados.message || "Não foi possível excluir o anúncio.");
            return;
        }

        roupas = roupas.filter((roupa) => Number(roupa.id) !== Number(id));
        cart = cart.filter((roupa) => Number(roupa.id) !== Number(id));
        renderizarRoupas(roupas);
        renderCart();
        aplicarFiltros();
    } catch (erro) {
        console.error(erro);
        alert("Erro ao excluir o anúncio.");
    }
}

function irParaFinalizacao() {
    if (cart.length === 0) {
        return;
    }

    const ids = cart.map((item) => Number(item.id)).join(",");
    window.location.href = `finalizar_doacao.php?ids=${encodeURIComponent(ids)}`;
}

</script>

</body>
</html>
