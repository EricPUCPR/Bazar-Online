<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Publicar Roupa</title>
    </head>
    <body>
        <header>
            <nav>
                <div class="botao">Catálogo</div>
                <div class="botao">Conta</div>
            </nav>
        </header>
        <main>
            <section id="form"> 
                <form id="cadastra">
                    <fieldset>Publique sua roupa aqui: </fieldset>
                    <label for="tipo_roupa">Digite o tipo da roupa: </label>
                    <input type="text" name="tipo">
                    <label for="tamanho_roupa">Digite o tamanho da roupa: </label>
                    <input type="text" name="tamanho">
                    <label for="sexo">Digite o sexo da roupa: </label>
                    <select id="Sexo" name="sexo">
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Unissex">Unissex</option> 
                    </select>  
                    <label for="Estado">Digite o Estado da roupa: </label>
                    <select id="Estado" name="Estado">
                        <option value="Novo">Novo</option>
                        <option value="Semi-Novo">Semi-Novo</option>
                        <option value="Usado - Bom Estado">Usado</option> 
                    </select>                                      
                </form>
            
            </section>
        </main>
        <footer>
            <p>Agradecemos por optar pelo nosso site!!</p>
            <p>^.^</p>
        </footer>
        <script>
            document.getElementById("cadastra").addEventListener("submit", function(e){
            e.preventDefault();
            const formData = new FormData(this);
            //cria onde vamos retornar o erro ou sucesso
            const feedback = document.getElementById("feedback")

            //declara pagina php destilo, metodo de transmissão e q
            fetch("../php/cadastro_roupa.php",{
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data =>{ //toma ação com base nos dados retornados
                    //retorna feedback conforme aceito ou recusa pelo back
                    feedback.textContent = data.mensage;
                    //feedback positivo retorna em verde e negativo em vermelho
                    feedback.style.color = data.success ? "green" : "red"; 

                    // Se deu certo, espera 2 segundos e leva a a pagina da pessoa publicadora
                    /*
                    if (data.success) {
                        setTimeout(() => {
                            window.location.href = "../index.html";
                        }, 2000);
                    }
                    */
                })
                .catch(error => {
                    console.error('Erro:', error);
                    feedback.textContent = "Erro interno no servidor.";
                });
                })
        </script>
    </body>
</html>
