<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Cadastro</title>
    </head>
    <body> aramis
        <header>
            <nav>
                <div class="botao">Criar conta</div>
                <div class="botao">Autenticar</div>
            </nav>
        </header>
        <main>
            <section> 
                <h1>Crie sua conta aqui: </h1>
                <form id="cadastra">

                    <label for="nome">Nome completo: </label>
                    <input type="text" name="nome">
                    
                    <label for="email">Email: </label>
                    <input type="email" name="email">
                    
                    <label for="telefone">telefone: </label>
                    <input type="text" name="telefone">

                    <label for="cep">Cep: </label>
                    <input type="text" name="cep"> 

                    <label for="senha1">Senha: </label>
                    <input type="password" name="senha1">
                    <label for="senha2">Senha: </label>
                    <input type="password" name="senha2">

                    <p id="feedback"></p>

                    <button type="submit">Enviar</button>
                    
                </form>
            
            </section>
        </main>
        <footer>
            <p>Agradecemos por optar pelo nosso site!!</p>
            <p>^.^</p>
        </footer>

        <script>
            document.getElementById("cadastra").addEventListener("submit", function(e){
                e.preventDefault();
                const formData = new FormData(this);
                fetch("../php/cadasteo_usuario.php",{
                    method: "POST",
                    body: formData
                }).then(response => response.json())
                .then(data =>{
                    const retorno = getElementById("feedback");
                    //retorna feedback conforme aceito ou recusa pelo back
                    retorno.textContent = data.mensage;
                    //feedback positivo retorna em verde e negativo em vermelho
                    retorno.style.color = data.success ? "green" : "red"; 

                    // if (data.success) {
                    // sessionStorage.setItem("usuario_nome", formData.get("username"));
                    // sessionStorage.setItem("loggedIn", "true");
                    // window.location.href = "index.html";
                    // }
                })


            })
        </script>

    </body>
</html>
