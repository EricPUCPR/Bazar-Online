<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Cadastro</title>
    </head>
    <body>
        <header>
            <nav>
                <div class="botao"><a href="autenticacao.html">Autenticar</a></div>
            </nav>
        </header>
        <main>
            <section> 
                <h1>Crie sua conta aqui: </h1>
                <form id="autentica">

                    <label for="nome">Nome completo: </label>
                    <input type="text" name="nome">
                    
                    <label for="email">Email: </label>
                    <input type="email" name="email">
                    
                    <label for="telefone">telefone: </label>
                    <input type="text" name="telefone">

                    <label for="cep">Cep: </label>
                    <input type="text" name="cep"> 

                    <label for="senha1">Senha: </label>
                    <input type="password" name="senha1">
                    <label for="senha2">Senha: </label>
                    <input type="password" name="senha2">

                    <button type="submit">Enviar</button>
                    
                </form>
            
            </section>
        </main>
        <footer>
            <p>Agradecemos por optar pelo nosso site!!</p>
            <p>^.^</p>
        </footer>

        <script>
            document.getElementById("autentica").addEventListener("submit", function(e){
                e.preventDefault();
            })
        </script>

    </body>
</html>
