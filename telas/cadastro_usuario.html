<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Cadastro</title>
        <link rel="stylesheet" href="../css/arq.css">
    </head>
    <body>
        <header>
            <nav>
                <div class="botao"><a href="autenticacao.html">Autenticar</a></div>
            </nav>
        </header>
        <main>
            <section class="form"> 
                <h1></h1>
                <form id="cadastra">
                    <fieldset>Crie sua conta aqui: </fieldset>

                    <label for="nome">Digite seu Nome completo: </label>
                    <input type="text" name="nome"><br>
                    
                    <label for="email">Email: </label>
                    <input type="email" name="email">
                    <span id="erro-email" style="color: red; display: none;">Formato de e-mail inválido!</span>
                    
                    <label for="telefone">Digite seu telefone: </label>
                    <input type="text" name="telefone"><br>

                    <label for="cep">Digite seu CEP: </label>
                    <input type="text" name="cep"> <br>

                    <label for="senha1">escolha uma senha: </label>
                    <input type="password" name="senha1"><br>
                    <label for="senha2">comfirme sua senha: </label>
                    <input type="password" name="senha2"><br>

                    <p id="feedback"></p><br>

                    <button type="submit">Enviar</button>
                    
                </form>
            
            </section>
        </main>
        <footer>
            <p>Agradecemos por optar pelo nosso site!!<br>^.^</p>
        </footer>

        <script>
            document.getElementById("cadastra").addEventListener("submit", function(e){
                e.preventDefault();
                const formData = new FormData(this);
                fetch("../php/cadasteo_usuario.php",{
                    method: "POST",
                    body: formData
                }).then(response => response.json())
                .then(data =>{
                    const retorno = getElementById("feedback");
                    //retorna feedback conforme aceito ou recusa pelo back
                    retorno.textContent = data.mensage;
                    //feedback positivo retorna em verde e negativo em vermelho
                    retorno.style.color = data.success ? "green" : "red"; 

                    // if (data.success) {
                    // sessionStorage.setItem("usuario_nome", formData.get("username"));
                    // sessionStorage.setItem("loggedIn", "true");
                    // window.location.href = "index.html";
                    // }
                })


            })
        </script>

    </body>
</html>
