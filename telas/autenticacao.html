<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Autenticação</title>
    </head>
    <body>
        <header>
            <nav>
                <div class="botao"></div><a href="cadastro_usuario.html">Criar conta</a></div>
            </nav>
        </header>
        <main>
            <section> 
                <h1>Acesse sua conta aqui: </h1>
                <form id="autentica">
                    <label for="email">Email: </label>
                    <input type="email" name="email">
                    <label for="senha">Senha: </label>
                    <input type="password" name="senha">

                    <button type="submit">Acessar</button>
                    
                </form>
            
            </section>
        </main>
        <footer>
            <p>Agradecemos por optar pelo nosso site!!</p>
            <p>^.^</p>
        </footer>

        <script>
            document.getElementById("autentica").addEventListener("submit", function(e){
                e.preventDefault();
                const formData = new FormData(this);
                fetch("../php/autentica.php",{
                    body: formData
                }).then(response => response.json())
                .then(data =>{
                    const retorno = getElementById("feedback");
                    //retorna feedback conforme aceito ou recusa pelo back
                    retorno.textContent = data.mensage;
                    //feedback positivo retorna em verde e negativo em vermelho
                    retorno.style.color = data.success ? "green" : "red"; 

                    // if (data.success) {
                    // sessionStorage.setItem("usuario_nome", formData.get("username"));
                    // sessionStorage.setItem("loggedIn", "true");
                    // window.location.href = "index.html";
                    // }
                })
            })
        </script>

    </body>
</html>
