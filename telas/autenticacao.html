<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Autenticação</title>
    </head>
    <body>
        <header>
            <nav>
                <div class="botao"></div><a href="cadastro_usuario.html">Criar conta</a></div>
            </nav>
        </header>
        <main>
            <section> 
                <h1>Acesse sua conta aqui: </h1>
                <form id="autentica">
                    <label for="email">Email: </label>
                    <input type="email" name="email">
                    <label for="senha">Senha: </label>
                    <input type="search" name="senha">

                    <button type="submit">Acessar</button>
                    
                </form>
            
            </section>
        </main>
        <footer>
            <p>Agradecemos por optar pelo nosso site!!</p>
            <p>^.^</p>
        </footer>

        <script>
            document.getElementById("autentica").addEventListener("submit", function(e){
                e.preventDefault();
            })
        </script>

    </body>
</html>
