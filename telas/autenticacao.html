<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Autenticação</title>
        <link rel="stylesheet" href="../css/arq.css">
    </head>
    <body>
        <header>
            <nav>
                <div class="botao"><a href="cadastro_usuario.html">Cadastro</a></div>
                <div class="botao"><a href="../index.html">Voltar</a></div>
            </nav>
        </header>
        <main>
            <section class="form"> 
                
                <form id="autentica">
                    <fieldset>Acesse sua conta aqui: </fieldset>
                    <label for="email">Email: </label>
                    <input type="email" name="email" id="email" >
                    <label for="senha">Senha: </label>
                    <input type="password" name="senha" id="senha">
                    
                    <span id="feedback"></span>

                    <button type="submit" id="botao">Acessar</button>
                    
                </form>
            
            </section>
        </main>
        <footer>
            <p>Agradecemos por optar pelo nosso site!!</p>
            <p>^.^</p>
        </footer>

        <script>
            const feedback = document.getElementById("feedback");
            const email = document.getElementById("email");
            const senha = document.getElementById("senha");
            const botao = document.getElementById("botao");
            
            document.addEventListener( 'input', () => {
                const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const regexSenha = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#]).{8,}$/;

                const emailOK = regexEmail.test(email.value);
                const senhaForte = regexSenha.test(senha.value);

                if (!emailOK) {
                    botao.style.display = "none";
                    feedback.textContent = "padrão de email invalido!";
                    feedback.style.color =  "red";
                } else {
                    if(senhaForte){
                        botao.style.display = "block";
                        feedback.style.display = "none";
                    } else {
                        botao.style.display = "block";
                        feedback.style.display = "none";
                        feedback.textContent = "usuario ou senha incorretos";
                    }
                    
                }
            })
            document.getElementById("autentica").addEventListener("submit", function(e){
                e.preventDefault();

                const feedback = document.getElementById("feedback");
                const formData = new FormData(this);
                fetch("../php/autentica.php",{
                    body: formData
                }).then(response => response.json())
                .then(data =>{
                    //retorna feedback conforme aceito ou recusa pelo back
                    feedback.textContent = data.mensage;
                    //feedback positivo retorna em verde e negativo em vermelho
                    feedback.style.color = data.success ? "green" : "red"; 
                
                        // Se deu certo, espera 2 segundos e leva a a pagina principal
                    if (data.success) {
                        setTimeout(() => {
                            window.location.href = "../index.html";
                        }, 2000);
                    }
                })
                .catch(error => {
                    console.error('Erro:', error);
                    feedback.textContent = "Erro interno no servidor.";
                });
            })
        </script>

    </body>
</html>
